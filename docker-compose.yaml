services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: shopflare-rabbitmq
    restart: unless-stopped
    ports:
      - '5672:5672'
      - '15672:15672'
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-guest}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  qdrant:
    image: qdrant/qdrant
    container_name: shopflare-qdrant
    restart: unless-stopped
    ports:
      - '6333:6333'
    volumes:
      - qdrant_data:/qdrant/storage

  mongodb:
    image: mongo
    container_name: shopflare-mongodb
    restart: unless-stopped
    ports:
      - '27017:27017'
    volumes:
      - mongo_data:/data/db

  worker:
    build:
      context: ./worker
      dockerfile: Dockerfile
    container_name: shopflare-embedding-worker
    restart: unless-stopped
    depends_on:
      - rabbitmq
      - qdrant
    environment:
      NODE_ENV: production
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASS:-guest}@rabbitmq:5672
      RABBITMQ_QUEUE_NAME: ${RABBITMQ_QUEUE_NAME:-product_updates}
      RABBITMQ_DLQ_NAME: ${RABBITMQ_DLQ_NAME:-product_updates_dlq}
      POLICY_RABBITMQ_QUEUE_NAME: ${POLICY_RABBITMQ_QUEUE_NAME:-policy_ingestion}
      POLICY_RABBITMQ_DLQ_NAME: ${POLICY_RABBITMQ_DLQ_NAME:-policy_ingestion_dlq}
      BACKEND_URL: ${BACKEND_URL:-http://host.docker.internal:9000}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-shopflare-internal-token}
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION_NAME: ${QDRANT_COLLECTION_NAME:-products}
      POLICY_QDRANT_COLLECTION_NAME: ${POLICY_QDRANT_COLLECTION_NAME:-customer_rights}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-openrouter}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
      EMBEDDING_VECTOR_SIZE: ${EMBEDDING_VECTOR_SIZE:-1536}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      EMBEDDING_MAX_RETRIES: ${EMBEDDING_MAX_RETRIES:-3}

volumes:
  rabbitmq_data:
  qdrant_data:
  mongo_data:
